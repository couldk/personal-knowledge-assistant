name: personal-knowledge-assistant

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: pka-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${PKA_POSTGRES_USER:-pka}
      POSTGRES_PASSWORD: ${PKA_POSTGRES_PASSWORD:-pka-local-password}
      POSTGRES_DB: ${PKA_POSTGRES_DB:-personal_knowledge}

    ports:
      - "${PKA_POSTGRES_PORT:-5432}:5432"

    volumes:
      - pka-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pka-postgres-data:
    name: pka-postgres-data