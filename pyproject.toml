[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-knowledge-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "langsmith>=0.10.18",
    "llama-index-core>=0.14.23",
    "markdown-it-py>=4.2.0",
    "openai>=2.53.0",
    "pgvector>=0.5.0,<0.6",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_knowledge_assistant"]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]
warn_unused_configs = true
